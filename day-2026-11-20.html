<title>Япония, ноябрь 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,650&family=Golos+Text:wght@400;500&family=Shippori+Mincho+B1:wght@800&display=swap">
<style>
:root { --bg: #F4EFE5; --surface: #FFFCF6; --ink: #221F1A; --muted: #6A6358; --line: #E0D8C8; --accent: #B5361C; color-scheme: light }
@media (prefers-color-scheme: dark) { :root { --bg: #14120F; --surface: #1D1A16; --ink: #ECE5D7; --muted: #A69D8D; --line: #342F28; --accent: #E8684A; color-scheme: dark } }
* { box-sizing: border-box }
html, body { height: 100% }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 "Golos Text", -apple-system, "Segoe UI", Roboto, sans-serif;
  display: grid; place-items: center; padding-inline: 16px }
.card { width: 100%; max-width: 340px; background: var(--surface); border: 1px solid var(--line); border-top: 3px solid var(--accent); border-radius: 6px; padding: 28px 24px; position: relative }
.tr { display: flex; align-items: center; gap: 12px; margin: 6px 0 18px }
.tr h1 { margin: 0 }
.hanko { flex: none; display: grid; place-items: center; width: 46px; height: 46px; background: var(--accent); color: var(--surface); border-radius: 6px;
  writing-mode: vertical-rl; font: 800 17px/1 "Shippori Mincho B1", "Hiragino Mincho ProN", serif; transform: rotate(-4deg);
  box-shadow: inset 0 0 0 2px var(--accent), inset 0 0 0 4px color-mix(in srgb, var(--surface) 75%, transparent) }
.eyebrow { font-size: 12px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); margin: 0 }
h1 { font-family: "Literata", Georgia, serif; font-weight: 650; font-size: 26px; line-height: 1.15; margin: 6px 0 18px }
label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px }
input[type=password] { width: 100%; font: 600 24px/1 ui-monospace, Menlo, monospace; letter-spacing: .5em; text-align: center;
  padding: 12px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink) }
input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.row { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: 13px; color: var(--muted) }
button { width: 100%; margin-top: 16px; font: 500 15px "Golos Text", sans-serif; padding: 11px; border: 0; border-radius: 8px; background: var(--ink); color: var(--bg); cursor: pointer }
button[disabled] { opacity: .6; cursor: progress }
.err { color: var(--accent); font-size: 13px; min-height: 1.5em; margin: 10px 0 0 }
</style>
</head>

</form>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const KEY = "jp2026-pin";

async function unlock(pin) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pin), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(SALT), iterations: ITERS, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const zipped = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(IV) }, key, b64(CT));
  const html = await new Response(new Blob([zipped]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
  document.open(); document.write(html); document.close();
}

const f = document.getElementById("f"), pin = document.getElementById("pin"), err = document.getElementById("err"), go = document.getElementById("go");
async function attempt(value, remember) {
  go.disabled = true; go.textContent = "Открываю…"; err.textContent = "";
  try {
    try { sessionStorage.setItem(KEY, value); } catch (e) {}
    if (remember) { try { localStorage.setItem(KEY, value); } catch (e) {} }
    await unlock(value);
  } catch (e) {
    try { localStorage.removeItem(KEY); sessionStorage.removeItem(KEY); } catch (e2) {}
    err.textContent = "Неверный PIN. Попробуйте ещё раз.";
    go.disabled = false; go.textContent = "Открыть"; pin.value = ""; pin.focus();
  }
}
f.addEventListener("submit", e => { e.preventDefault(); attempt(pin.value.trim(), document.getElementById("rem").checked); });
let saved = null; try { saved = localStorage.getItem(KEY) || sessionStorage.getItem(KEY); } catch (e) {}
if (saved) attempt(saved, true);
